ShortDescription: Play Windows audio on multiple speakers and Bluetooth headphones at once, in sync.
Description: |-
  SyncSound captures Windows audio and plays it on up to eight outputs at the same time: wired, USB, HDMI and Bluetooth.
  A one-click microphone calibration measures when each speaker reaches your seat and aligns them, so Bluetooth lag
  no longer causes an echo. It also offers per-speaker EQ and room correction, bass routing and virtual bass for small
  speakers, a room map with 7.1 and 8D spatial sound, per-app routing, and FIR convolution.
